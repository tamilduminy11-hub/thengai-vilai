<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>தேங்காய் விலை</title>
<meta name="description" content="Free daily coconut and copra market rates for farmers. Kangayam, Pollachi, Kochi and more. Source: Coconut Development Board and Agmarknet.">
<meta name="theme-color" content="#24452c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5ef;
  --surface: #ffffff;
  --ink: #1d261d;
  --ink-2: #4f5b4e;
  --ink-3: #7a8578;
  --line: #dde3d6;
  --leaf: #24452c;
  --leaf-ink: #f1f6ee;
  --husk: #7a4a21;
  --up: #17763a;
  --up-bg: #e3f2e6;
  --down: #b3261e;
  --down-bg: #f9e4e2;
  --flat-bg: #eceee8;
  --focus: #2f6fd6;
  --chart-line: #7a4a21;
  --chart-grid: #e4e8de;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111511;
    --surface: #1a201a;
    --ink: #e8ede4;
    --ink-2: #b6c0b2;
    --ink-3: #8a9586;
    --line: #2c352b;
    --leaf: #1c3622;
    --leaf-ink: #e8f2e3;
    --husk: #e0a76f;
    --up: #6fcf8b;
    --up-bg: #183a22;
    --down: #f08a80;
    --down-bg: #44201c;
    --flat-bg: #252c24;
    --focus: #7fb0ff;
    --chart-line: #e0a76f;
    --chart-grid: #2a3229;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Catamaran", "Noto Sans Tamil", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums lining-nums;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

header.top {
  background: var(--leaf);
  color: var(--leaf-ink);
  padding: 14px 0 18px;
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: 0.01em; margin: 0; }
.lang {
  border: 1.5px solid color-mix(in srgb, var(--leaf-ink) 55%, transparent);
  background: transparent;
  color: var(--leaf-ink);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 36px;
}

.hero { padding: 18px 0 4px; }
.hero-label { font-size: 16px; font-weight: 500; opacity: 0.9; margin: 0; }
.hero-price {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 2px 0 0;
}
.hero-price .num { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.hero-price .per { font-size: 18px; font-weight: 500; opacity: 0.85; }
.hero-meta { margin: 8px 0 0; font-size: 15px; opacity: 0.85; }
.hero-spark { display: block; width: 100%; height: 44px; margin-top: 12px; }

.units {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  margin: 16px 0 6px;
}
.units button {
  border: 0; background: transparent; border-radius: 9px;
  padding: 8px 4px; font-size: 16px; font-weight: 700; color: var(--ink-2);
  cursor: pointer; min-height: 40px;
}
.units button[aria-pressed="true"] { background: var(--husk); color: var(--surface); }

.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 4px 16px; font-size: 16px; font-weight: 700; min-height: 40px; cursor: pointer;
}
.chips button[aria-pressed="true"] { border-color: var(--husk); color: var(--husk); }
.note { font-size: 14px; color: var(--ink-3); margin: 8px 0 0; }

section.group { margin: 26px 0 0; }
section.group h2 {
  font-size: 19px; font-weight: 800; margin: 0 0 8px; color: var(--husk);
}
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 12px;
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
  min-height: 64px;
}
.row:first-child { border-top: 0; }
.row:active { background: var(--flat-bg); }
.row .mkt { font-size: 17px; font-weight: 700; }
.row .when { font-size: 13.5px; color: var(--ink-3); grid-column: 1; }
.row .price { font-size: 22px; font-weight: 800; text-align: right; grid-row: 1; grid-column: 2; }
.row .chg { grid-column: 2; justify-self: end; }
.chg {
  display: inline-block; font-size: 13.5px; font-weight: 700;
  padding: 0 8px; border-radius: 999px; line-height: 22px; white-space: nowrap;
}
.chg.up { color: var(--up); background: var(--up-bg); }
.chg.down { color: var(--down); background: var(--down-bg); }
.chg.flat { color: var(--ink-3); background: var(--flat-bg); }

footer { margin: 34px 0 40px; font-size: 14px; color: var(--ink-3); }
footer p { margin: 0 0 8px; }
footer a { color: var(--ink-2); }

.state { padding: 40px 0; text-align: center; color: var(--ink-2); }
.state button {
  margin-top: 12px; border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 8px 18px; font-weight: 700; cursor: pointer;
}

dialog {
  border: 0; padding: 0; width: 100%; max-width: 560px;
  margin: auto auto 0; max-height: 92vh;
  border-radius: 18px 18px 0 0;
  background: var(--surface); color: var(--ink);
}
dialog::backdrop { background: rgba(10, 14, 10, 0.55); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 18px; } }
.sheet { padding: 16px 16px 24px; overflow-y: auto; max-height: 92vh; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h3 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.3; }
.sheet-head .sub { margin: 2px 0 0; font-size: 14px; color: var(--ink-3); }
.close {
  border: 0; background: var(--flat-bg); border-radius: 999px;
  width: 40px; height: 40px; font-size: 22px; line-height: 1; cursor: pointer; flex: none;
}
.sheet-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 12px 0 0; }
.sheet-price .num { font-size: 40px; font-weight: 800; line-height: 1; }
.conv { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.ranges { display: flex; gap: 6px; overflow-x: auto; margin: 16px 0 8px; padding-bottom: 2px; }
.ranges button {
  flex: none; border: 1.5px solid var(--line); background: transparent;
  border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 15px;
  cursor: pointer; min-height: 36px; color: var(--ink-2);
}
.ranges button[aria-pressed="true"] { border-color: var(--husk); color: var(--husk); }
.chart-box { position: relative; height: 220px; }
.days { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
.days li {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 15.5px;
}
.days .v { font-weight: 700; display: flex; gap: 8px; align-items: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="brand" data-t="brand">தேங்காய் விலை</h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">English</button>
    </div>
    <div class="hero" id="hero" aria-live="polite"></div>
  </div>
</header>

<main class="wrap">
  <div class="units" role="group" aria-label="Unit" id="units">
    <button type="button" data-unit="kg" aria-pressed="true"></button>
    <button type="button" data-unit="quintal" aria-pressed="false"></button>
    <button type="button" data-unit="tonne" aria-pressed="false"></button>
  </div>
  <div class="chips" role="group" aria-label="Market" id="chips"></div>
  <p class="note" data-t="lagNote"></p>
  <div id="list"><div class="state" data-t="loading"></div></div>

  <footer>
    <p data-t="sourceNote"></p>
    <p><a href="https://coconutboard.in/priceweb/Reports.aspx" rel="noopener">coconutboard.in</a> · <a href="https://agmarknet.gov.in" rel="noopener">agmarknet.gov.in</a></p>
    <p id="checked"></p>
  </footer>
</main>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <h3 id="sheet-title"></h3>
        <p class="sub" id="sheet-sub"></p>
      </div>
      <button class="close" type="button" id="close" aria-label="Close">×</button>
    </div>
    <div class="sheet-price" id="sheet-price"></div>
    <p class="conv" id="sheet-conv"></p>
    <div class="ranges" role="group" aria-label="Range" id="ranges"></div>
    <div class="chart-box"><canvas id="chart" role="img" aria-label="Price trend"></canvas></div>
    <ul class="days" id="days"></ul>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  "use strict";

  var T = {
    ta: {
      brand: "தேங்காய் விலை",
      switchTo: "English",
      loading: "விலைகளை ஏற்றுகிறது…",
      failed: "விலைகளை ஏற்ற முடியவில்லை. இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயலுங்கள்.",
      retry: "மீண்டும் முயல்க",
      heroLabel: "காங்கேயம் அரவை கொப்பரை",
      kg: "கிலோ", quintal: "குவிண்டால்", tonne: "டன்",
      per: "ஒரு ",
      up: "▲ ₹", down: "▼ ₹", flat: "மாற்றமில்லை",
      lagNote: "அரசு தரவு. சில நாட்களில் ஒரு நாள் தாமதமாக வரலாம்; ஒவ்வொரு விலைக்கும் அதன் தேதி காட்டப்படுகிறது.",
      sourceNote: "ஆதாரம்: தென்னை வளர்ச்சி வாரியம் (Coconut Development Board), அக்மார்க்நெட் (Agmarknet). விவசாயிகளுக்கு இலவசம்.",
      checked: "கடைசியாகச் சரிபார்த்தது",
      cdb: "தென்னை வளர்ச்சி வாரியம்",
      agmarknet: "அக்மார்க்நெட்",
      ranges: { "20": "20 நாள்", "30": "1 மாதம்", "90": "3 மாதம்", "180": "6 மாதம்", "365": "1 வருடம்" },
      months: ["ஜன", "பிப்", "மார்", "ஏப்", "மே", "ஜூன்", "ஜூலை", "ஆக", "செப்", "அக்", "நவ", "டிச"],
      groups: {
        milling_copra: "அரவை கொப்பரை", ball_copra: "பந்து கொப்பரை",
        coconut_black: "தேங்காய் (கருப்பு)", coconut_green: "தேங்காய் (பச்சை)",
        coconut: "தேங்காய் (மாநில சராசரி)", copra: "கொப்பரை (மாநில சராசரி)",
        coconut_oil: "தேங்காய் எண்ணெய்", tender_coconut: "இளநீர் (மாநில சராசரி)",
        desiccated_coconut: "உலர் தேங்காய் துருவல்"
      },
      areas: { all: "அனைத்தும்", kangayam: "காங்கேயம்", pollachi: "பொள்ளாச்சி", coimbatore: "கோவை / உடுமலை", kerala: "கேரளா", karnataka: "கர்நாடகா", state: "மாநில சராசரி" },
      empty: "இந்த நேரத்தில் புதிய விலைகள் இல்லை."
    },
    en: {
      brand: "Coconut rates",
      switchTo: "தமிழ்",
      loading: "Loading rates…",
      failed: "Couldn't load rates. Check your internet connection and try again.",
      retry: "Try again",
      heroLabel: "Kangayam milling copra",
      kg: "kg", quintal: "quintal", tonne: "tonne",
      per: "per ",
      up: "▲ ₹", down: "▼ ₹", flat: "No change",
      lagNote: "Government data. On some days it arrives a day late, so every rate shows its own date.",
      sourceNote: "Source: Coconut Development Board and Agmarknet. Free for farmers.",
      checked: "Last checked",
      cdb: "Coconut Development Board",
      agmarknet: "Agmarknet",
      ranges: { "20": "20D", "30": "1M", "90": "3M", "180": "6M", "365": "1Y" },
      months: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
      groups: {
        milling_copra: "Milling copra", ball_copra: "Ball copra",
        coconut_black: "Coconut (black)", coconut_green: "Coconut (green)",
        coconut: "Coconut (state average)", copra: "Copra (state average)",
        coconut_oil: "Coconut oil", tender_coconut: "Tender coconut (state average)",
        desiccated_coconut: "Desiccated coconut"
      },
      areas: { all: "All", kangayam: "Kangayam", pollachi: "Pollachi", coimbatore: "Coimbatore / Udumalpet", kerala: "Kerala", karnataka: "Karnataka", state: "State average" },
      empty: "No recent rates right now."
    }
  };
  var GROUP_ORDER = ["milling_copra", "ball_copra", "coconut_black", "coconut_green",
                     "coconut_oil", "desiccated_coconut", "copra", "coconut", "tender_coconut"];
  var AREA_OF = { kangayam: "kangayam", kangayam_mkt: "kangayam", pollachi: "pollachi", pollachi_mkt: "pollachi",
                  coimbatore: "coimbatore", udumalpet: "coimbatore", kochi: "kerala", kozhikode: "kerala",
                  tiptur: "karnataka", arisikere: "karnataka", tamil_nadu: "state", kerala: "state" };
  var AREA_ORDER = ["all", "kangayam", "pollachi", "coimbatore", "kerala", "karnataka", "state"];
  var MARKET_ORDER = ["kangayam", "kangayam_mkt", "pollachi", "pollachi_mkt", "udumalpet",
                      "coimbatore", "tamil_nadu", "kochi", "kozhikode", "kerala", "tiptur", "arisikere"];
  var FACTOR = { kg: 1, quintal: 100, tonne: 1000 };
  var STALE_DAYS = 10;

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var lang = store.get("tv.lang", "ta") === "en" ? "en" : "ta";
  var unit = FACTOR[store.get("tv.unit", "kg")] ? store.get("tv.unit", "kg") : "kg";
  var latest = null;
  var seriesCache = {};
  var chart = null;
  var open = null;
  var range = "20";
  var area = store.get("tv.area", "all");

  function t(k) { return T[lang][k]; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function money(perKg, u) {
    var v = perKg * FACTOR[u || unit];
    var digits = (u || unit) === "kg" && Math.round(v) !== v ? 2 : 0;
    return "₹" + v.toLocaleString("en-IN", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function fmtDate(iso) {
    var p = iso.split("-");
    return parseInt(p[2], 10) + " " + t("months")[parseInt(p[1], 10) - 1];
  }
  function asOn(iso) { return lang === "ta" ? fmtDate(iso) + " நிலவரம்" : "As on " + fmtDate(iso); }
  function chgHtml(c) {
    if (c === null || c === undefined) return "";
    var v = Math.abs(c * FACTOR[unit]);
    var shown = v.toLocaleString("en-IN", { maximumFractionDigits: unit === "kg" ? 2 : 0 });
    if (Math.abs(c) < 0.005) return '<span class="chg flat">' + t("flat") + "</span>";
    return c > 0
      ? '<span class="chg up">' + t("up") + shown + "</span>"
      : '<span class="chg down">' + t("down") + shown + "</span>";
  }
  function name(item, field) { return item[field + "_" + lang] || item[field + "_en"]; }
  function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t("brand");
    $("lang").textContent = t("switchTo");
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
      var k = el.getAttribute("data-t");
      if (typeof T[lang][k] === "string") el.textContent = T[lang][k];
    });
    Array.prototype.forEach.call(document.querySelectorAll("#units button"), function (b) {
      var u = b.getAttribute("data-unit");
      b.textContent = t(u);
      b.setAttribute("aria-label", "₹ / " + t(u));
      b.setAttribute("aria-pressed", String(u === unit));
    });
  }

  function freshItems() {
    var newest = latest.items.reduce(function (m, i) { return i.date > m ? i.date : m; }, "0000");
    return latest.items.filter(function (i) { return daysBetween(i.date, newest) <= STALE_DAYS; });
  }

  function renderHero() {
    var h = latest.items.filter(function (i) { return i.id === "cdb.milling_copra.kangayam"; })[0];
    if (!h) { $("hero").innerHTML = ""; return; }
    $("hero").innerHTML =
      '<p class="hero-label">' + esc(t("heroLabel")) + "</p>" +
      '<p class="hero-price"><span class="num">' + money(h.per_kg) + "</span>" +
      '<span class="per">' + esc(t("per") + t(unit)) + "</span> " + chgHtml(h.change_per_kg) + "</p>" +
      '<p class="hero-meta">' + esc(asOn(h.date) + ", " + t(h.source)) + "</p>" +
      '<svg class="hero-spark" id="spark" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true"></svg>';
    loadSeries(h.id).then(function (rows) {
      var pts = rows.slice(-20);
      if (pts.length < 2 || !$("spark")) return;
      var vals = pts.map(function (r) { return r[1]; });
      var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = hi - lo || 1;
      var d = pts.map(function (r, i) {
        var x = (i / (pts.length - 1)) * 296 + 2, y = 40 - ((r[1] - lo) / span) * 36;
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join(" ");
      var last = d.split(" ").slice(-2);
      $("spark").innerHTML =
        '<path d="' + d + '" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
        '<circle cx="' + last[0].replace(/[ML]/, "") + '" cy="' + last[1] + '" r="3.5" fill="currentColor"/>';
    });
  }

  function renderChips() {
    var present = {};
    freshItems().forEach(function (i) { present[AREA_OF[i.market]] = true; });
    if (area !== "all" && !present[area]) area = "all";
    $("chips").innerHTML = AREA_ORDER.filter(function (a) { return a === "all" || present[a]; }).map(function (a) {
      return '<button type="button" data-area="' + a + '" aria-pressed="' + (a === area) + '">' + esc(t("areas")[a]) + "</button>";
    }).join("");
  }

  function renderList() {
    var items = freshItems().filter(function (i) { return area === "all" || AREA_OF[i.market] === area; });
    if (!items.length) { $("list").innerHTML = '<div class="state">' + esc(t("empty")) + "</div>"; return; }
    var groups = {};
    items.forEach(function (i) { (groups[i.product] = groups[i.product] || []).push(i); });
    var html = "";
    GROUP_ORDER.forEach(function (g) {
      var rows = groups[g];
      if (!rows) return;
      rows.sort(function (a, b) { return MARKET_ORDER.indexOf(a.market) - MARKET_ORDER.indexOf(b.market); });
      html += '<section class="group"><h2>' + esc(t("groups")[g]) + '</h2><div class="rows">';
      rows.forEach(function (i) {
        html += '<button type="button" class="row" data-id="' + esc(i.id) + '">' +
          '<span class="mkt">' + esc(name(i, "market")) + "</span>" +
          '<span class="price">' + money(i.per_kg) + "</span>" +
          '<span class="when">' + esc(asOn(i.date)) + "</span>" +
          '<span class="chg-wrap" style="grid-column:2;justify-self:end">' + chgHtml(i.change_per_kg) + "</span>" +
          "</button>";
      });
      html += "</div></section>";
    });
    $("list").innerHTML = html;
  }

  function renderChecked() {
    var g = latest.generated;
    var d = new Date(g);
    var time = isNaN(d) ? g : d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Kolkata" });
    $("checked").textContent = t("checked") + ": " + fmtDate(g.slice(0, 10)) + ", " + time;
  }

  function renderAll() {
    applyStatic();
    if (!latest) return;
    renderHero();
    renderChips();
    renderList();
    renderChecked();
    if (open) renderSheet();
  }

  function loadSeries(id) {
    if (seriesCache[id]) return Promise.resolve(seriesCache[id]);
    return fetch("data/series/" + encodeURIComponent(id) + ".json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rows) { seriesCache[id] = rows; return rows; });
  }

  function renderSheet() {
    var i = open;
    $("sheet-title").textContent = t("groups")[i.product] + ", " + name(i, "market");
    $("sheet-sub").textContent = asOn(i.date) + ", " + t(i.source);
    $("sheet-price").innerHTML = '<span class="num">' + money(i.per_kg) + "</span><span>" +
      esc(t("per") + t(unit)) + "</span> " + chgHtml(i.change_per_kg);
    $("sheet-conv").textContent = ["kg", "quintal", "tonne"].filter(function (u) { return u !== unit; })
      .map(function (u) { return money(i.per_kg, u) + " / " + t(u); }).join("   ");
    $("ranges").innerHTML = Object.keys(T.en.ranges).map(function (r) {
      return '<button type="button" data-range="' + r + '" aria-pressed="' + (r === range) + '">' + esc(t("ranges")[r]) + "</button>";
    }).join("");
    loadSeries(i.id).then(drawSeries).catch(function () {
      $("days").innerHTML = "<li>" + esc(t("failed")) + "</li>";
    });
  }

  function drawSeries(rows) {
    if (!open) return;
    var newest = rows.length ? rows[rows.length - 1][0] : null;
    var pts = rows.filter(function (r) { return newest && daysBetween(r[0], newest) < parseInt(range, 10); });
    var labels = pts.map(function (r) { return fmtDate(r[0]); });
    var vals = pts.map(function (r) { return +(r[1] * FACTOR[unit]).toFixed(2); });
    var css = getComputedStyle(document.documentElement);
    var line = css.getPropertyValue("--chart-line").trim();
    var grid = css.getPropertyValue("--chart-grid").trim();
    var muted = css.getPropertyValue("--ink-3").trim();
    $("chart").setAttribute("aria-label", $("sheet-title").textContent + ": " +
      (vals.length ? labels[0] + " " + vals[0] + " … " + labels[labels.length - 1] + " " + vals[vals.length - 1] : ""));
    if (window.Chart) {
      if (chart) chart.destroy();
      chart = new Chart($("chart"), {
        type: "line",
        data: { labels: labels, datasets: [{ data: vals, borderColor: line, backgroundColor: line, borderWidth: 2,
          pointRadius: vals.length > 40 ? 0 : 3, pointHoverRadius: 5, tension: 0.25 }] },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: false }, tooltip: { displayColors: false,
            callbacks: { label: function (c) { return "₹" + c.parsed.y.toLocaleString("en-IN") + " / " + t(unit); } } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: muted, maxTicksLimit: 6, maxRotation: 0 } },
            y: { grid: { color: grid }, ticks: { color: muted, callback: function (v) { return "₹" + v.toLocaleString("en-IN"); } } }
          }
        }
      });
    }
    var html = "";
    for (var k = pts.length - 1, n = 0; k >= 0 && n < 30; k--, n++) {
      var c = k > 0 ? pts[k][1] - pts[k - 1][1] : null;
      html += "<li><span>" + esc(fmtDate(pts[k][0])) + '</span><span class="v">' + money(pts[k][1]) + " " + chgHtml(c) + "</span></li>";
    }
    $("days").innerHTML = html;
  }

  function load() {
    $("list").innerHTML = '<div class="state">' + esc(t("loading")) + "</div>";
    fetch("data/latest.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { latest = d; renderAll(); })
      .catch(function () {
        $("list").innerHTML = '<div class="state">' + esc(t("failed")) +
          '<br><button type="button" id="retry">' + esc(t("retry")) + "</button></div>";
        $("retry").addEventListener("click", load);
      });
  }

  $("lang").addEventListener("click", function () {
    lang = lang === "ta" ? "en" : "ta"; store.set("tv.lang", lang); renderAll();
  });
  $("units").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-unit]"); if (!b) return;
    unit = b.getAttribute("data-unit"); store.set("tv.unit", unit); renderAll();
  });
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-area]"); if (!b) return;
    area = b.getAttribute("data-area"); store.set("tv.area", area); renderChips(); renderList();
  });
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest(".row"); if (!b || !latest) return;
    open = latest.items.filter(function (i) { return i.id === b.getAttribute("data-id"); })[0];
    if (!open) return;
    renderSheet();
    $("sheet").showModal();
  });
  $("ranges").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-range]"); if (!b) return;
    range = b.getAttribute("data-range"); renderSheet();
  });
  $("close").addEventListener("click", function () { $("sheet").close(); });
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) $("sheet").close(); });
  $("sheet").addEventListener("close", function () { open = null; });

  applyStatic();
  load();
})();
</script>
</body>
</html>
